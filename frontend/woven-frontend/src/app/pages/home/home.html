<div class="home">

  <!-- Coaching summary card (full-screen overlay, surfaces on app open) -->
  <woven-coaching-card
    *ngIf="coachingSummary"
    [summary]="coachingSummary"
    (dismissed)="onCoachingDismissed()"
  ></woven-coaching-card>

  <div class="top">
    <div class="brandRow">
      <div class="brand">WOVEN</div>
      <button class="infoBtn" (click)="openHowItWorks()" title="How Woven works">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Guide</span>
      </button>
    </div>
    <div class="meta">{{ activeLabel }}</div>
  </div>

  <div class="watermark">W</div>

  <button class="pulsePill" *ngIf="pulse" (click)="openPulse()" [class.missing]="!pulse.answered">
    <span class="dotMini"></span>
    <span class="pulseText">Pulse</span>
    <span class="pulseStatus">{{ pulse.answered ? 'Saved' : 'Missing' }}</span>
    <span class="pulseCountdown" *ngIf="countdownText">{{ countdownText }}</span>
  </button>

  <div class="pulseErr" *ngIf="pulseError">{{ pulseError }}</div>

  <!-- Push nudge (one-time, requires user tap to call requestPermission) -->
  <div class="pushNudge" *ngIf="showPushNudge">
    <span class="pushNudgeText">Get notified when you get messages</span>
    <button class="pushNudgeOn" (click)="enablePush()">Turn on</button>
    <button class="pushNudgeLater" (click)="dismissPushNudge()">Later</button>
  </div>

  <div class="content">
    <div class="panel">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <nav class="tabs">
    <button class="tab" [class.active]="isActive('/moments')" (click)="go('moments')">
      <div class="tabIcon">◈</div>
      <span>Moments</span>
    </button>
    <button class="tab" [class.active]="isActive('/commons')" (click)="go('commons')">
      <div class="tabIcon">◇</div>
      <span>Commons</span>
    </button>
    <button class="tab" [class.active]="isActive('/chats')" (click)="go('chats')">
      <div class="tabIcon">🎈</div>
      <span>Chats</span>
    </button>
    <button class="tab" [class.active]="isActive('/you')" (click)="go('you')">
      <div class="tabIcon">♡</div>
      <span>You</span>
    </button>
  </nav>

  <app-pulse-sheet
    *ngIf="pulseSheetOpen"
    [state]="pulse"
    [readonly]="!canEditPulse()"
    (closed)="closePulse()"
    (saved)="submitPulse($event)"
  ></app-pulse-sheet>

  <app-how-it-works-sheet
    *ngIf="howItWorksOpen"
    (closed)="closeHowItWorks()"
  ></app-how-it-works-sheet>

  <woven-assistant></woven-assistant>

  <!-- Feedback prompt overlay -->
  <div class="feedbackOverlay" *ngIf="feedbackPrompt">
    <div class="feedbackCard">
      <button class="feedbackDismiss" (click)="dismissFeedback()">✕</button>

      <div class="feedbackTitle">
        How did it go with {{ feedbackPrompt.partnerFirstName }}?
      </div>

      <!-- Step 1: met in person? -->
      <div class="feedbackRow" *ngIf="feedbackMet === null">
        <div class="feedbackLabel">Did you meet up?</div>
        <div class="feedbackBtns">
          <button class="feedbackChoice" (click)="setFeedbackMet(true)">Yes</button>
          <button class="feedbackChoice" (click)="setFeedbackMet(false)">Not yet</button>
        </div>
      </div>

      <!-- Step 2: stars (if met) -->
      <ng-container *ngIf="feedbackMet !== null">
        <div class="feedbackRow" *ngIf="feedbackMet">
          <div class="feedbackLabel">How was it?</div>
          <div class="feedbackStars">
            <button class="starBtn" *ngFor="let s of [1,2,3,4,5]"
                    [class.active]="feedbackStars >= s"
                    (click)="setFeedbackStars(s)">★</button>
          </div>
        </div>
        <div class="feedbackRow" *ngIf="!feedbackMet">
          <div class="feedbackLabel dim">That's okay — maybe next time.</div>
        </div>

        <button class="feedbackSubmit"
                (click)="submitFeedback()"
                [disabled]="feedbackSubmitting || (feedbackMet && feedbackStars === 0)">
          {{ feedbackSubmitting ? 'Saving…' : 'Submit' }}
        </button>
      </ng-container>
    </div>
  </div>

</div>
