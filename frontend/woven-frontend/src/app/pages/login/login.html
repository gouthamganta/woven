<!-- ── Intro video overlay ─────────────────────────── -->
<div class="intro" #introEl>
  <video
    #introVideo
    class="intro-video"
    src="login-intro.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
    (ended)="onVideoEnd()"
  ></video>
  <button class="skip-btn" #skipBtn (click)="skipIntro()">Skip ↵</button>
</div>

<!-- ── Login card ────────────────────────────────────── -->
<div class="login-stage">
  <div class="card" #cardEl>

    <div class="brand">
      <h1 class="logo">Woven</h1>
      <p class="tagline">Energy. Intention. Chemistry.</p>
    </div>

    <div class="divider"></div>

    <div class="action">
      <p class="kicker">Sign in to continue</p>

      <!-- Consent checkbox — must agree before Google button is active -->
      <label class="consent" [class.checked]="agreed">
        <span class="consent-box" (click)="toggleAgree()">
          <svg *ngIf="agreed" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="consent-text">
          I have read and agree to the
          <a href="/terms" target="_blank">Terms of Service</a>,
          <a href="/privacy" target="_blank">Privacy Policy</a>
          and
          <a href="/data-policy" target="_blank">Data Policy</a>.
        </span>
      </label>

      <!-- Google button — locked until agreed -->
      <div class="googleWrap" [class.locked]="!agreed">
        <div id="googleBtn"></div>
        <div class="lock-overlay" *ngIf="!agreed" (click)="onLockedClick()"></div>
      </div>

      <p class="cookie-note">
        We use essential cookies for authentication only.
        No advertising or tracking cookies are used.
      </p>

      <div class="state" *ngIf="isLoading">Signing you in…</div>
      <div class="state err" *ngIf="!isLoading && errorMsg">{{ errorMsg }}</div>
    </div>

  </div>
</div>
