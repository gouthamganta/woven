<div class="game-container" *ngIf="currentQuestion">
  <div class="progress-indicator">{{ currentQuestionIndex() + 1 }} of {{ totalQuestions() }}</div>
  <div class="header">
    <div class="question-text">{{ currentQuestion.question }}</div>
    <div class="subtitle">Pick {{ currentQuestion.maxSelect }}</div>
  </div>

  <div class="options-grid">
    <button
      *ngFor="let option of currentQuestion.options"
      class="option-pill"
      [class.selected]="isSelected(option)"
      (click)="toggle(option)"
      type="button"
    >
      {{ option.label }}
    </button>
  </div>

  <button
    class="continue-btn"
    (click)="onNext()"
    [disabled]="!canProceed()"
    type="button"
  >
    Continue
  </button>
</div>
