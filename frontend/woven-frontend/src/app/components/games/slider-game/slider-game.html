<div class="game-container" *ngIf="currentQuestion">
  <div class="progress-indicator">{{ currentQuestionIndex() + 1 }} of {{ totalQuestions() }}</div>
  <div class="question-text">{{ currentQuestion.question }}</div>

  <div class="slider-wrapper">
    <div class="slider-labels">
      <span class="label-left">{{ currentQuestion.leftLabel }}</span>
      <span class="label-right">{{ currentQuestion.rightLabel }}</span>
    </div>

    <div class="slider-track">
      <input
        type="range"
        min="0"
        max="100"
        [(ngModel)]="value"
        class="slider-input"
      />
      <div class="slider-fill" [style.width.%]="value()"></div>
      <div class="slider-thumb" [style.left.%]="value()"></div>
    </div>
  </div>

  <button class="continue-btn" (click)="onNext()">Continue</button>
</div>
