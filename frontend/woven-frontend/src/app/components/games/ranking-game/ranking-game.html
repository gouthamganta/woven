<div class="game-container" *ngIf="currentQuestion">
  <div class="progress-indicator">{{ currentQuestionIndex() + 1 }} of {{ totalQuestions() }}</div>
  <div class="question-text">{{ currentQuestion.question }}</div>

  <div
    cdkDropList
    class="ranking-list"
    (cdkDropListDropped)="drop($event)"
  >
    <div
      *ngFor="let item of rankedItems(); let i = index"
      cdkDrag
      class="rank-item"
    >
      <span class="rank-number">{{ i + 1 }}</span>
      <span class="rank-label">{{ item }}</span>
      <div class="drag-handle" cdkDragHandle>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="7" cy="5" r="1.5"/>
          <circle cx="13" cy="5" r="1.5"/>
          <circle cx="7" cy="10" r="1.5"/>
          <circle cx="13" cy="10" r="1.5"/>
          <circle cx="7" cy="15" r="1.5"/>
          <circle cx="13" cy="15" r="1.5"/>
        </svg>
      </div>
    </div>
  </div>

  <button class="continue-btn" (click)="onNext()">Continue</button>
</div>
