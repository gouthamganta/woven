<div class="game-card" *ngIf="currentQuestion">
  <app-game-progress
    [current]="currentQuestionIndex() + 1"
    [total]="totalQuestions()"
  />

  <div class="game-content">
    <h3>{{ currentQuestion.question }}</h3>

    <div class="card-stack">
      <div
        class="swipe-card"
        *ngFor="let option of currentQuestion.options; let i = index"
        [class.active]="i === currentCardIndex()"
      >
        <p>{{ option.text }}</p>
      </div>
    </div>

    <div class="swipe-actions">
      <button class="swipe-btn nope" (click)="swipe('left')" type="button">
        👎 Nope
      </button>
      <button class="swipe-btn yes" (click)="swipe('right')" type="button">
        👍 Yes!
      </button>
    </div>
  </div>
</div>
