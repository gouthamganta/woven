<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Games v2 - Woven</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@300..900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&display=swap");

    :root {
      --bg-base: #0E0912;
      --bg-surface: #160D1C;
      --rose-400: #C0392B;
      --rose-glow: rgba(192, 57, 43, 0.30);
      --green-300: #52c47a;
      --green-glow: rgba(82, 196, 122, 0.22);
      --plum-400: #7F77DD;
      --plum-glow: rgba(127, 119, 221, 0.26);
      --gold-400: #D4A017;
      --gold-glow: rgba(212, 160, 23, 0.36);
      --text-primary: rgba(255, 248, 240, 0.96);
      --text-secondary: rgba(240, 225, 200, 0.72);
      --text-xs: 0.75rem;
      --border-subtle: rgba(255, 255, 255, 0.10);
      --border-soft: rgba(255, 255, 255, 0.15);
      --font-display: "Fraunces", Georgia, serif;
      --font-ui: "DM Sans", sans-serif;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --text-base: 1rem;
      --text-sm: 0.875rem;
      --text-xl: 1.25rem;
      --text-3xl: 1.875rem;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: radial-gradient(ellipse at 20% 30%, rgba(158, 153, 232, 0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 70%, rgba(192, 57, 43, 0.12) 0%, transparent 50%),
                  var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, var(--plum-glow) 0%, transparent 30%),
                  radial-gradient(circle at 70% 60%, var(--rose-glow) 0%, transparent 30%);
      animation: drift 25s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.5;
      z-index: 0;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-8%, -8%); }
      66% { transform: translate(8%, -12%); }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      gap: var(--space-16);
    }

    .nav {
      position: fixed;
      top: var(--space-6);
      right: var(--space-6);
      display: flex;
      gap: var(--space-3);
      z-index: 10;
      flex-wrap: wrap;
      max-width: 400px;
    }

    .nav-btn {
      padding: var(--space-3) var(--space-5);
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--plum-400);
      color: var(--plum-400);
      box-shadow: 0 0 20px var(--plum-glow);
    }

    .nav-btn.active {
      border-color: var(--rose-400);
      color: var(--rose-400);
      box-shadow: 0 0 20px var(--rose-glow);
    }

    .game {
      display: none;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .game.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-12);
    }

    .progress-indicator {
      position: absolute;
      top: -40px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      opacity: 0.7;
    }

    .question-text {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.3;
    }

    .subtitle {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      text-align: center;
      opacity: 0.7;
    }

    /* Rating Scale (Swipe Game) */
    .card-display {
      width: 100%;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-4);
    }

    .option-card {
      width: 100%;
      padding: var(--space-8);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: 0 0 30px rgba(127, 119, 221, 0.15);
    }

    .option-text {
      font-size: var(--text-xl);
      color: var(--text-primary);
      text-align: center;
      line-height: 1.5;
    }

    .rating-scale {
      display: flex;
      gap: var(--space-2);
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .rating-btn {
      flex: 1;
      min-width: 70px;
      padding: var(--space-3);
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      color: var(--text-secondary);
    }

    .rating-btn:nth-child(1):hover {
      border-color: var(--rose-400);
      box-shadow: 0 0 20px var(--rose-glow);
      color: var(--rose-400);
      transform: scale(1.05);
    }

    .rating-btn:nth-child(3):hover {
      border-color: var(--plum-400);
      box-shadow: 0 0 20px var(--plum-glow);
      color: var(--plum-400);
      transform: scale(1.05);
    }

    .rating-btn:nth-child(5):hover {
      border-color: var(--green-300);
      box-shadow: 0 0 20px var(--green-glow);
      color: var(--green-300);
      transform: scale(1.05);
    }

    .rating-emoji {
      font-size: 20px;
    }

    .rating-label {
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
    }

    /* Selection Pills */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
      width: 100%;
    }

    .option-pill {
      padding: var(--space-4) var(--space-5);
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      font-size: var(--text-base);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(127, 119, 221, 0.08);
    }

    .option-pill:hover {
      border-color: var(--plum-400);
      color: var(--text-primary);
      box-shadow: 0 0 25px var(--plum-glow);
    }

    .option-pill.selected {
      border-color: var(--plum-400);
      color: var(--plum-400);
      box-shadow: 0 0 30px var(--plum-glow);
    }
  </style>
</head>
<body>
  <div class="nav">
    <button class="nav-btn" onclick="showGame('swipe')">Swipe (Rating)</button>
    <button class="nav-btn active" onclick="showGame('selection')">Selection</button>
  </div>

  <div class="container">
    <!-- Swipe/Rating Game -->
    <div id="swipe" class="game">
      <div class="progress-indicator">2 of 5</div>
      <div class="question-text">How much do these things fascinate you?</div>
      <div class="card-display">
        <div class="option-card">
          <div class="option-text">Why some songs make you cry</div>
        </div>
      </div>
      <div class="rating-scale">
        <button class="rating-btn">
          <span class="rating-emoji">😐</span>
          <span class="rating-label">Strongly<br>Disagree</span>
        </button>
        <button class="rating-btn">
          <span class="rating-emoji">🤔</span>
          <span class="rating-label">Disagree</span>
        </button>
        <button class="rating-btn">
          <span class="rating-emoji">😶</span>
          <span class="rating-label">Neutral</span>
        </button>
        <button class="rating-btn">
          <span class="rating-emoji">😊</span>
          <span class="rating-label">Agree</span>
        </button>
        <button class="rating-btn">
          <span class="rating-emoji">🤩</span>
          <span class="rating-label">Strongly<br>Agree</span>
        </button>
      </div>
    </div>

    <!-- Selection Game -->
    <div id="selection" class="game active">
      <div class="progress-indicator">4 of 8</div>
      <div class="question-text">Your perfect Saturday includes...</div>
      <div class="subtitle">Pick 3</div>
      <div class="options-grid">
        <button class="option-pill">Hiking or sports</button>
        <button class="option-pill selected">Art, music, or DIY</button>
        <button class="option-pill selected">Learning a new skill</button>
        <button class="option-pill">Brunch with friends</button>
        <button class="option-pill selected">Sleeping in</button>
        <button class="option-pill">Home movie marathon</button>
      </div>
    </div>
  </div>

  <script>
    function showGame(gameId) {
      document.querySelectorAll('.game').forEach(g => g.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(gameId).classList.add('active');
      event.target.classList.add('active');
    }

    document.querySelectorAll('.option-pill').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('selected'));
    });
  </script>
</body>
</html>
