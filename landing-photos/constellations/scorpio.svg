<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Stars -->
  <circle cx="50" cy="80" r="3" fill="#D4A017" opacity="0.9"/>
  <circle cx="90" cy="70" r="4" fill="#D4A017" opacity="0.95"/>
  <circle cx="130" cy="90" r="3.5" fill="#D4A017" opacity="0.9"/>
  <circle cx="160" cy="120" r="5" fill="#D4A017" opacity="1"/>
  <circle cx="180" cy="160" r="3.5" fill="#D4A017" opacity="0.9"/>
  <circle cx="190" cy="200" r="3" fill="#D4A017" opacity="0.85"/>
  <circle cx="210" cy="220" r="4" fill="#D4A017" opacity="0.9"/>
  <circle cx="240" cy="210" r="3" fill="#D4A017" opacity="0.85"/>
  <circle cx="260" cy="190" r="3.5" fill="#D4A017" opacity="0.9"/>

  <!-- Constellation lines -->
  <g stroke="#D4A017" stroke-width="1.5" opacity="0.4">
    <line x1="50" y1="80" x2="90" y2="70"/>
    <line x1="90" y1="70" x2="130" y2="90"/>
    <line x1="130" y1="90" x2="160" y2="120"/>
    <line x1="160" y1="120" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="190" y2="200"/>
    <line x1="190" y1="200" x2="210" y2="220"/>
    <line x1="210" y1="220" x2="240" y2="210"/>
    <line x1="240" y1="210" x2="260" y2="190"/>
  </g>

  <!-- Smaller background stars for depth -->
  <circle cx="70" cy="100" r="1.5" fill="#D4A017" opacity="0.3"/>
  <circle cx="140" cy="140" r="1.5" fill="#D4A017" opacity="0.25"/>
  <circle cx="220" cy="180" r="1.5" fill="#D4A017" opacity="0.3"/>
  <circle cx="100" cy="50" r="1.5" fill="#D4A017" opacity="0.25"/>
  <circle cx="230" cy="240" r="1.5" fill="#D4A017" opacity="0.3"/>
</svg>
