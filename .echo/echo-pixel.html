<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ECHO - Pixel Character</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #canvas3d {
            width: 70%;
            height: 100%;
            background: #000;
        }

        #panel {
            width: 30%;
            background: #111;
            padding: 20px;
            border-left: 3px solid #0f0;
            overflow-y: auto;
        }

        h1 {
            color: #0ff;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #0ff;
        }

        #mood {
            font-size: 1.5em;
            text-align: center;
            padding: 15px;
            background: #000;
            border: 2px solid #0f0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bar-container {
            margin: 15px 0;
        }

        .bar-label {
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .bar {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid #0f0;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: #0f0;
            transition: width 0.3s;
        }

        #mic-level {
            height: 40px;
            background: #f00;
        }

        #conversation {
            background: #000;
            border: 2px solid #0f0;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 0.85em;
        }

        .msg {
            margin: 8px 0;
            padding: 5px;
        }

        .msg.you { color: #0ff; }
        .msg.echo { color: #f0f; }

        #status {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border: 2px solid #0f0;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas3d"></canvas>

        <div id="panel">
            <h1>◆ ECHO ◆</h1>

            <div id="mood">IDLE</div>

            <div class="bar-container">
                <div class="bar-label">🎤 MIC LEVEL (SPEAK TO TEST)</div>
                <div class="bar">
                    <div class="bar-fill" id="mic-level" style="width: 0%"></div>
                </div>
            </div>

            <div class="bar-container">
                <div class="bar-label">ENERGY: <span id="energy-val">70</span>%</div>
                <div class="bar">
                    <div class="bar-fill" id="energy-bar" style="width: 70%"></div>
                </div>
            </div>

            <div class="bar-container">
                <div class="bar-label">PATIENCE: <span id="patience-val">60</span>%</div>
                <div class="bar">
                    <div class="bar-fill" id="patience-bar" style="width: 60%"></div>
                </div>
            </div>

            <div class="bar-container">
                <div class="bar-label">EXCITEMENT: <span id="excitement-val">55</span>%</div>
                <div class="bar">
                    <div class="bar-fill" id="excitement-bar" style="width: 55%"></div>
                </div>
            </div>

            <div id="conversation"></div>

            <div id="status">Connecting...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== 3D PIXEL CHARACTER =====
        let scene, camera, renderer, character;
        let clock = new THREE.Clock();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(60, 0.7, 0.1, 1000);
            camera.position.set(0, 15, 35);
            camera.lookAt(0, 10, 0);

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas3d'),
                antialias: false  // Pixelated look
            });
            const canvas = document.getElementById('canvas3d');
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);

            // Lighting
            const ambient = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambient);

            const light = new THREE.PointLight(0x00ffff, 3, 100);
            light.position.set(0, 30, 20);
            scene.add(light);

            // Create pixel character
            createCharacter();

            animate();
        }

        function createCharacter() {
            character = new THREE.Group();

            // Voxel material
            const mat = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.3,
                flatShading: true  // Pixelated
            });

            // Body (tall rectangle)
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(8, 12, 6),
                mat
            );
            body.position.y = 6;
            character.add(body);

            // Head (cube)
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 6),
                mat
            );
            head.position.y = 15;
            character.add(head);

            // Eyes (glowing cubes)
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const eyeLeft = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1.5, 0.5),
                eyeMat
            );
            eyeLeft.position.set(-1.5, 15.5, 3.1);
            character.add(eyeLeft);

            const eyeRight = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1.5, 0.5),
                eyeMat
            );
            eyeRight.position.set(1.5, 15.5, 3.1);
            character.add(eyeRight);

            // Mouth (changes size when speaking)
            window.mouthCube = new THREE.Mesh(
                new THREE.BoxGeometry(3, 0.5, 0.5),
                new THREE.MeshBasicMaterial({ color: 0xff00ff })
            );
            window.mouthCube.position.set(0, 14, 3.1);
            character.add(window.mouthCube);

            // Arms
            const armMat = new THREE.MeshPhongMaterial({
                color: 0x00ff00,
                flatShading: true
            });

            const armLeft = new THREE.Mesh(
                new THREE.BoxGeometry(2, 8, 2),
                armMat
            );
            armLeft.position.set(-6, 8, 0);
            character.add(armLeft);

            const armRight = new THREE.Mesh(
                new THREE.BoxGeometry(2, 8, 2),
                armMat
            );
            armRight.position.set(6, 8, 0);
            character.add(armRight);

            // Legs
            const legLeft = new THREE.Mesh(
                new THREE.BoxGeometry(3, 6, 3),
                armMat
            );
            legLeft.position.set(-2, -3, 0);
            character.add(legLeft);

            const legRight = new THREE.Mesh(
                new THREE.BoxGeometry(3, 6, 3),
                armMat
            );
            legRight.position.set(2, -3, 0);
            character.add(legRight);

            scene.add(character);
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Idle rotation
            character.rotation.y += 0.005;

            // Bounce
            character.position.y = Math.sin(elapsed * 2) * 0.5;

            renderer.render(scene, camera);
        }

        // ===== STATE UPDATE =====
        let lastConvLen = 0;

        function updateState() {
            fetch('http://localhost:8765/state')
                .then(r => r.json())
                .then(data => {
                    // Mood
                    document.getElementById('mood').textContent = data.mood.toUpperCase();

                    // Mic level (real-time)
                    const micLevel = (data.mic_level * 100).toFixed(0);
                    document.getElementById('mic-level').style.width = micLevel + '%';

                    // Bars
                    document.getElementById('energy-val').textContent = data.energy;
                    document.getElementById('energy-bar').style.width = data.energy + '%';
                    document.getElementById('patience-val').textContent = data.patience;
                    document.getElementById('patience-bar').style.width = data.patience + '%';
                    document.getElementById('excitement-val').textContent = data.excitement;
                    document.getElementById('excitement-bar').style.width = data.excitement + '%';

                    // Animate mouth when speaking
                    if (window.mouthCube) {
                        if (data.is_speaking) {
                            const size = 0.5 + Math.sin(Date.now() / 100) * 1.5;
                            window.mouthCube.scale.y = size;
                        } else {
                            window.mouthCube.scale.y = 1;
                        }
                    }

                    // Change character color based on mood
                    if (data.mood === 'listening') {
                        character.children[0].material.color.setHex(0x00ff00);
                    } else if (data.mood === 'thinking') {
                        character.children[0].material.color.setHex(0xffff00);
                    } else if (data.mood === 'speaking') {
                        character.children[0].material.color.setHex(0xff00ff);
                    } else {
                        character.children[0].material.color.setHex(0x00ffff);
                    }

                    document.getElementById('status').textContent = 'CONNECTED - LISTENING';
                })
                .catch(() => {
                    document.getElementById('status').textContent = 'DISCONNECTED';
                });
        }

        function updateConversation() {
            fetch('http://localhost:8765/conversation')
                .then(r => r.json())
                .then(msgs => {
                    if (msgs.length !== lastConvLen) {
                        const box = document.getElementById('conversation');

                        for (let i = lastConvLen; i < msgs.length; i++) {
                            const msg = msgs[i];
                            const div = document.createElement('div');
                            div.className = 'msg ' + msg.speaker;

                            const time = new Date(msg.time * 1000).toLocaleTimeString();
                            const speaker = msg.speaker === 'you' ? 'YOU' : 'ECHO';

                            div.innerHTML = `[${time}] ${speaker}: ${msg.text}`;
                            box.appendChild(div);
                        }

                        box.scrollTop = box.scrollHeight;
                        lastConvLen = msgs.length;
                    }
                });
        }

        // ===== INIT =====
        init3D();
        setInterval(updateState, 100);  // Fast updates for mic level
        setInterval(updateConversation, 1000);
        updateState();
        updateConversation();
    </script>
</body>
</html>
